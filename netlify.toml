[build]
base = "."
command = "pnpm run build:docs && pnpm run build:storybook && rm -rf apps/docs/dist/client/storybook && cp -R packages/@luke-ui/react/storybook-static apps/docs/dist/client/storybook"
publish = "apps/docs/dist/client"
functions = "apps/docs/.netlify/v1/functions"

[functions]
node_bundler = "esbuild"
external_node_modules = ["oxfmt", "@oxfmt/binding-linux-x64-gnu"]
