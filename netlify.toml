[build]
base = "."
command = "pnpm run build:docs"
publish = "apps/docs/dist/client"
functions = "apps/docs/.netlify/v1/functions"
edge_functions = "apps/docs/netlify/edge-functions"

[build.environment]
# The deploy's public origin, baked into absolute URLs at build time.
SITE_URL = "https://luke-ui.netlify.app"
