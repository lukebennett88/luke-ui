allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

packages:
  - apps/*
  - packages/*
  - packages/@luke-ui/*

catalogMode: prefer

peerDependencyRules:
  allowedVersions:
    '@joshwooding/vite-plugin-react-docgen-typescript>vite': ^8.0.0
    '@tailwindcss/vite>vite': ^8.0.0
    vite: '*'
    vitest: '*'

  allowAny:
    - vite
    - vitest

minimumReleaseAge: 7200 # 5 days, in minutes

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

trustLockfile: true

trustPolicy: no-downgrade

