allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

packages:
  - .github/scripts
  - apps/*
  - packages/*
  - packages/@luke-ui/*

catalogMode: strict

peerDependencyRules:
  allowedVersions:
    '@joshwooding/vite-plugin-react-docgen-typescript>vite': ^8.0.0
    '@tailwindcss/vite>vite': ^8.0.0
    vite: '*'
    vitest: '*'

  allowAny:
    - vite
    - vitest

minimumReleaseAge: 4320 # 3 days, in minutes

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

trustLockfile: true

# trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - '@netlify/serverless-functions-api@2.18.0'

