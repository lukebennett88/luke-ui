name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  component-tests:
    name: component-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling with mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @luke-ui/react exec playwright install --with-deps chromium

      - name: Build package
        run: pnpm build:packages

      - name: Run component tests
        run: pnpm --filter @luke-ui/react run test:ci

  docs-tests:
    name: docs-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling with mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Build package
        run: pnpm build:packages

      - name: Generate docs app files
        run: pnpm --filter docs run generate

      - name: Run docs tests
        run: pnpm --filter docs run test
