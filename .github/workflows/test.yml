name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      react-spec:
        description:
          Published @luke-ui/react version or dist-tag for consumer-tests. Leave empty to pack the
          branch.
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  nonvisual-tests:
    name: nonvisual-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Playwright Chromium
        run: pnpm --filter @luke-ui/react exec playwright install --with-deps chromium

      # Serialise suites on CI: parallel browser suites starve each other on one runner and
      # time out the docs search tests.
      - name: Run every non-visual suite
        run: pnpm exec turbo run test test:consumer test:integration --filter='!//' --concurrency=1
        env:
          LUKE_UI_REACT_SPEC: ${{ inputs.react-spec }}
