name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      react-spec:
        description:
          Published @luke-ui/react version or dist-tag for consumer-tests. Leave empty to pack the
          branch.
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  component-tests:
    name: component-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Playwright Chromium
        run: pnpm --filter @luke-ui/react exec playwright install --with-deps chromium

      - name: Run component tests
        run: pnpm exec turbo run test --filter=@luke-ui/react

      - name: Run theme build integration tests
        run: pnpm exec turbo run test:integration --filter=@luke-ui/theme-build

      - name: Run package tests
        run:
          pnpm exec turbo run test --filter=@luke-ui/playground-core
          --filter=@luke-ui/rainbow-sprinkles

  consumer-tests:
    name: consumer-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Playwright Chromium
        run: pnpm --filter @luke-ui/react exec playwright install --with-deps chromium

      - name: Run consumer tests
        run: pnpm test:consumer
        env:
          LUKE_UI_REACT_SPEC: ${{ inputs.react-spec }}

  docs-tests:
    name: docs-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Playwright Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Run docs tests
        run: pnpm exec turbo run test --filter=docs

      - name: Upload docs test failure screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: docs-test-failure-screenshots
          path: apps/docs/.vitest/attachments
          if-no-files-found: ignore

  reference-app-tests:
    name: reference-app-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Install Playwright Chromium
        run: pnpm --filter @luke-ui/react exec playwright install --with-deps chromium

      - name: Run reference app tests
        run: pnpm exec turbo run test --filter=reference-app
