name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Build all packages and applications
        run: pnpm build

      - name: Run complete checks
        run: pnpm check

      - name: Require checks to preserve tracked files
        run: git diff --exit-code
