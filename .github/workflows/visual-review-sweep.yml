name: Visual review sweep

# Stops a pull request's `visual-review` check run passing when it no longer describes the latest
# comparison against the current baseline. `Visual review publish` keeps the check run current on
# every comparison event. This catches what it left behind:
#
# - a comparison that finished while every publication of it failed, through a failed step, a
#   dropped event, or a brief API outage
# - a baseline that changed without `main` changing, through a dispatch or a re-run of
#   `Visual baseline`
# - a check run that passes on a failed or `Comparing` record, because a review decision landed on
#   a record written at the same moment and the review backend could not repair it
# - a check run still in progress or needing action long after the latest comparison finished
#   without a recorded result
#
# The sweep only fails check runs. It does not publish a report or record a result, so the remedy
# for `Publishing the report failed` is to re-run the comparison.
#
# Only the publisher writes the check run's external id. The sweep writes how the check run reads
# and nothing else, and sends no external id, so the response to its write names the record the
# write landed on. When a publication landed in between, the sweep writes that record's own
# presentation again. A concurrency group shared with the publisher would not do: a queued sweep
# would replace a queued publisher run and drop a publication.
#
# The sweep does not recover from a failure of anything it shares with the publisher: the App
# credentials, the script on `main`, the `visual-review` environment, and GitHub Actions itself.
# Then neither workflow can write, and any pass already recorded on a commit can stay passing: an
# approval or a `No visual changes` result, after a later comparison of that commit, or after a
# dispatch or a re-run replaced its baseline. The failed runs of both workflows are the signal.
#
# The sweep never checks out or runs pull request code, and reads no artefacts.

on:
  workflow_run:
    workflows: ['Visual baseline']
    # Any conclusion: a failed re-run also leaves no current baseline.
    types: [completed]
  # A publication can fail without leaving an event that would retry it.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: visual-review-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    # Inert until the publisher is configured. `vars` here must be a repository variable:
    # environment variables are not available to a job-level `if`. A dispatch from another branch
    # does not run, and the environment's branch rule keeps the App key from it anyway.
    if: >-
      github.ref == 'refs/heads/main' && vars.VISUAL_REVIEW_APP_CLIENT_ID != '' &&
      vars.VISUAL_REVIEW_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's private key lives in this environment, restricted to `main`.
    environment: visual-review
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # This checks out the default branch, which is the trusted code that handles the App key.
      # Never check out a pull request head here: its scripts would run with that key.
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      # Scoped to this repository, because no `repositories` are named. A scheduled event has no
      # repository in its payload to name. The token can write check runs and pull request comments
      # and nothing else.
      - name: Create a visual review App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.VISUAL_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.VISUAL_REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write

      # Reads (pull requests, runs, the baseline) use the workflow token. Writes use the App token,
      # so the check run and comment stay the App's.
      - name: Sweep the visual-review check runs
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/visual-review.ts sweep
