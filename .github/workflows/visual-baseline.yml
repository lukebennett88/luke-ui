name: Visual baseline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A cancelled run leaves no baseline for the next PR.
  group: visual-baseline
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # GitHub Actions may not preserve the image ENV; point at the browsers baked into the container.
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    # Digest-pinned Playwright image (keep tag+digest in sync with PLAYWRIGHT_VISUAL_IMAGE in
    # packages/@luke-ui/react/scripts/visual-regression-contract.ts and visual-regression.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy@sha256:c064e7f355d2dda32f669801a1b09e86a1e9252395c844d2cfbbe5c44acb9b79
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        env:
          # Browsers ship in the container; skip the npm postinstall download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Build packages
        run: pnpm build:packages

      - name: Confirm container browsers
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH}"
          test "${PLAYWRIGHT_BROWSERS_PATH}" = '/ms-playwright'
          ls "${PLAYWRIGHT_BROWSERS_PATH}"
          ls -d "${PLAYWRIGHT_BROWSERS_PATH}"/chromium_headless_shell-*

      - name: Render baseline captures
        env:
          VISUAL_CAPTURE_DIR: ${{ github.workspace }}/.artifacts/visual-regression/baseline
        run: pnpm --filter @luke-ui/react run test:visual:capture

      - name: Fail when nothing rendered
        env:
          VISUAL_CAPTURE_DIR: ${{ github.workspace }}/.artifacts/visual-regression/baseline
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci check-captures

      - name: Upload baseline
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline
          path: .artifacts/visual-regression/baseline
          if-no-files-found: error
          retention-days: 90
