name: Visual baseline

on:
  push:
    branches:
      - main
    paths:
      - 'packages/@luke-ui/react/**'
      - 'packages/@luke-ui/rainbow-sprinkles/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/scripts/**'
      - '.github/workflows/visual-baseline.yml'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

concurrency:
  # A cancelled run leaves no baseline for the next PR.
  group: visual-baseline
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup tooling with mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @luke-ui/react exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build:packages

      - name: Render baseline captures
        env:
          VISUAL_CAPTURE_DIR: ${{ github.workspace }}/.artifacts/visual-regression/baseline
        run: pnpm --filter @luke-ui/react run test:visual:capture

      - name: Fail when nothing rendered
        env:
          VISUAL_CAPTURE_DIR: ${{ github.workspace }}/.artifacts/visual-regression/baseline
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci check-captures

      - name: Upload baseline
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline
          path: .artifacts/visual-regression/baseline
          if-no-files-found: error
          retention-days: 90
