name: Visual regression

on:
  pull_request:
    paths:
      - 'packages/@luke-ui/react/**'
      - 'packages/@luke-ui/rainbow-sprinkles/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/scripts/**'
      - '.github/workflows/visual-baseline.yml'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    # Digest-pinned Playwright image (keep tag+digest in sync with visual-baseline.yml and
    # docs/VISUAL_TESTING.md): same browser, OS fonts, and font rendering as baseline.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy@sha256:c064e7f355d2dda32f669801a1b09e86a1e9252395c844d2cfbbe5c44acb9b79
      options: --ipc=host
    permissions:
      actions: read
      contents: read
    outputs:
      review: ${{ steps.summary.outputs.review }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile --no-runtime

      # Overlap package build with baseline resolve/download.
      # Download still waits on steps.baseline.outputs.run-id; compare waits on both.
      - name: Build packages
        id: build
        run: pnpm build:packages
        background: true

      - name: Resolve baseline
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci resolve-baseline

      - name: Download baseline
        uses: actions/download-artifact@v8
        with:
          name: visual-baseline
          path: .artifacts/visual-regression/baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run-id }}

      - name: Fail when the baseline has no screenshots
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci check-captures

      - wait: [build]

      - name: Compare against the baseline
        run: pnpm --filter @luke-ui/react run test:visual

      - name: Summarise the comparison
        id: summary
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci summarise

      - name: Upload expected, actual, and diff screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diff
          path: |
            .artifacts/visual-regression/diff
            .artifacts/visual-regression/summary.json
          if-no-files-found: ignore
          retention-days: 14

  review:
    name: review
    if: needs.compare.outputs.review != '0'
    needs: compare
    runs-on: ubuntu-latest
    environment: visual-review
    permissions: {}
    steps:
      - name: Record the approval
        run: |
          echo "Approved ${{ needs.compare.outputs.review }} baseline change(s) for ${{ github.sha }}."
