name: Visual regression

on:
  pull_request:
    paths:
      - 'packages/@luke-ui/react/**'
      - 'packages/@luke-ui/rainbow-sprinkles/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      review: ${{ steps.summary.outputs.review }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download the main baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Do not skip a newer failed run for an older baseline.
          read -r run_id run_status run_conclusion <<<"$(gh api \
            "repos/${GH_REPO}/actions/workflows/visual-baseline.yml/runs?branch=main&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion // "none")"')"
          if [ -z "${run_id:-}" ]; then
            echo '::error::No baseline run found. Run "Visual baseline" on `main`, then re-run this job.'
            exit 1
          fi
          run_url="https://github.com/${GH_REPO}/actions/runs/${run_id}"
          echo "Newest Visual baseline run on \`main\`: ${run_id} (status=${run_status}, conclusion=${run_conclusion})."
          if [ "$run_status" != "completed" ]; then
            echo "::error::Newest baseline run is ${run_status}. Wait for ${run_url}, then re-run this job."
            exit 1
          fi
          if [ "$run_conclusion" != "success" ]; then
            echo "::error::Newest baseline run concluded ${run_conclusion}. Re-run ${run_url}, then re-run this job."
            exit 1
          fi
          echo "Baseline from Visual baseline run ${run_id}."
          mkdir -p .artifacts/visual-regression/baseline
          if ! gh run download "$run_id" --name visual-baseline --dir .artifacts/visual-regression/baseline; then
            echo "::error::Baseline artefact missing or expired. Re-run ${run_url}, then re-run this job."
            exit 1
          fi
          count=$(find .artifacts/visual-regression/baseline -name '*.png' | wc -l)
          echo "Downloaded $count baseline screenshots."
          if [ "$count" -eq 0 ]; then
            echo "::error::Baseline artefact is empty. Re-run ${run_url}, then re-run this job."
            exit 1
          fi

      - name: Setup tooling with mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: corepack pnpm --filter @luke-ui/react exec playwright install --with-deps chromium

      - name: Build packages
        run: corepack pnpm build:packages

      - name: Compare against the baseline
        run: corepack pnpm --filter @luke-ui/react run test:visual

      - name: Summarise the comparison
        id: summary
        run: |
          set -euo pipefail
          summary=.artifacts/visual-regression/summary.json
          jq -r '
            "| status | count |", "| --- | --- |",
            (.counts | to_entries[] | "| \(.key) | \(.value) |")
          ' "$summary" >> "$GITHUB_STEP_SUMMARY"
          review=$(jq '.counts.changed + .counts.added + .counts.removed' "$summary")
          echo "review=$review" >> "$GITHUB_OUTPUT"
          jq -r '.results[] | select(.status != "unchanged") | "\(.status)\t\(.id)"' "$summary"

      - name: Upload expected, actual, and diff screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diff
          path: |
            .artifacts/visual-regression/diff
            .artifacts/visual-regression/summary.json
          if-no-files-found: ignore
          retention-days: 14

  review:
    name: review
    if: needs.compare.outputs.review != '0'
    needs: compare
    runs-on: ubuntu-latest
    environment: visual-review
    permissions: {}
    steps:
      - name: Record the approval
        run: |
          echo "Approved ${{ needs.compare.outputs.review }} baseline change(s) for ${{ github.sha }}."
