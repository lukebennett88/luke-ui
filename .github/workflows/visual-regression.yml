name: Visual regression

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # GitHub Actions may not preserve the image ENV; point at the browsers baked into the container.
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

jobs:
  image:
    uses: ./.github/workflows/visual-image.yml

  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required: ${{ steps.impact.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Check visual impact
        id: impact
        run: node .github/scripts/visual-impact.ts

  compare:
    name: compare
    needs: [impact, image]
    if: needs.impact.outputs.required == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup tooling
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Build packages
        run: pnpm build:packages

      - name: Resolve baseline
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci resolve-baseline

      - name: Download baseline
        uses: actions/download-artifact@v8
        with:
          name: visual-baseline
          path: .artifacts/visual-regression/baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run-id }}

      - name: Fail when the baseline has no screenshots
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci check-captures

      - name: Confirm container browsers
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH}"
          test "${PLAYWRIGHT_BROWSERS_PATH}" = '/ms-playwright'
          ls "${PLAYWRIGHT_BROWSERS_PATH}"
          ls -d "${PLAYWRIGHT_BROWSERS_PATH}"/chromium_headless_shell-*

      - name: Compare against the baseline
        env:
          VISUAL_REPORT_ONLY: '1'
        run: pnpm --filter @luke-ui/react run test:visual:run

      - name: Summarise the comparison
        run: pnpm --filter @luke-ui/workflow-scripts run visual-ci summarise

      - name: Upload expected, actual, and diff screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diff
          path: |
            .artifacts/visual-regression/diff
            .artifacts/visual-regression/summary.json
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: visual-regression
    if: always()
    needs: [impact, compare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Require a complete comparison
        env:
          IMPACT: ${{ needs.impact.result }}
          REQUIRED: ${{ needs.impact.outputs.required }}
          COMPARE: ${{ needs.compare.result }}
        run: bash .github/scripts/visual-gate.sh
