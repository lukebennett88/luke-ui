name: Visual review publish

# Publishes a pull request's visual-regression-diff artefact for the visual review app, records
# the `visual-review` check run for the commit, and links the report from one sticky comment.
# The check run and the comment belong to the visual review GitHub App, so its review backend can
# update them when someone approves or requests changes.
#
# `workflow_run` starts this workflow from the default branch with secrets. Each event only names
# a commit: the workflow records the state of that commit's latest `Visual regression` run. While
# that run is going it sets the check run to `Comparing`, so no earlier decision on the commit keeps
# passing. Once it finishes, it publishes the result. A dropped or late event is harmless, because
# the next event records the same latest state. The artefact is data produced by pull request
# code: `visual-review.ts prepare` validates it and rebuilds the site from an allow-list.
#
# GitHub sends no `requested` event for a re-run, so `in_progress` also starts a reconciliation.

on:
  workflow_run:
    workflows: ['Visual regression']
    types: [requested, in_progress, completed]

permissions: {}

# Runs for one pull request serialise. A run in progress finishes its deploy and its comment
# together, so the comment never points at a half-published report, and GitHub keeps only the
# newest queued run. The newest data wins because `resolve-pr` reads the latest comparison for the
# pull request's head when it runs, never the run the event describes.
concurrency:
  group: >-
    visual-review-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    # Inert until the Pages project is configured. `vars` here must be a repository variable:
    # environment variables are not available to a job-level `if`. Started, failed, and cancelled
    # runs also reach `resolve-pr`, so the check run records them.
    if: >-
      github.event.workflow_run.event == 'pull_request' && vars.VISUAL_REVIEW_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live in this environment, restricted to `main`, so a workflow edited
    # in a pull request cannot read them.
    environment: visual-review
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # This checks out the default branch, which is the trusted code that handles the secrets.
      # Never check out the pull request head here: its scripts would run with those secrets.
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      # Created first, so the last step can record a failed publication when anything after it
      # fails, `resolve-pr` included. The token can write check runs and pull request comments and
      # nothing else. The App's private key lives in the `visual-review` environment with the
      # Cloudflare secrets.
      - name: Create a visual review App token
        id: app-token
        if: vars.VISUAL_REVIEW_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.VISUAL_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.VISUAL_REVIEW_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: write

      # Every `github.event.*` value reaches the scripts through `env`, never interpolated into
      # shell text, so a branch name cannot inject commands.
      #
      # The event only names a commit. `resolve-pr` reconciles from that commit's latest
      # comparison, whichever event arrived, and outputs the run and attempt that every later step
      # uses. The App token reads the check run, so a result already recorded is not written again.
      - name: Resolve pull request
        id: pr
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: node .github/scripts/visual-review.ts resolve-pr

      # Downloaded outside the workspace so nothing in the artefact can shadow repository files.
      # `resolve-pr` has already confirmed the run uploaded it: started runs and prose-only pull
      # requests, which skip the compare job, stop at `publish=false`.
      - name: Download diff artefact
        if: steps.pr.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: visual-regression-diff
          path: ${{ runner.temp }}/visual-review-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.pr.outputs.run-id }}

      # `prepare` creates `visual-review-deploy` itself and fails if it already exists, so the
      # directory Wrangler runs in is known to hold the prepared site and nothing else.
      - name: Prepare site
        if: steps.pr.outputs.publish == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/visual-review-artifact
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SITE_DIR: ${{ runner.temp }}/visual-review-deploy/site
          RUN_ATTEMPT: ${{ steps.pr.outputs.run-attempt }}
          RUN_ID: ${{ steps.pr.outputs.run-id }}
        run: node .github/scripts/visual-review.ts prepare "$ARTIFACT_DIR" "$SITE_DIR"

      # Wrangler runs from the fresh directory `prepare` created. Run from the repository root,
      # `pages deploy` would bundle the root `functions/` directory (the docs site's Pages
      # Functions) into this deployment, and the action would try to install Wrangler into the
      # pnpm workspace.
      #
      # The action and Wrangler are pinned to exact versions because this job holds the Cloudflare
      # secrets.
      #
      # Always pass an explicit `--branch=pr-<number>`. A deploy without it can land on the
      # production branch and overwrite the viewer app.
      - name: Deploy to Cloudflare Pages
        if: steps.pr.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}/visual-review-deploy
          packageManager: npm
          wranglerVersion: '4.162.0'
          command: >-
            pages deploy site --project-name=${{ vars.VISUAL_REVIEW_PAGES_PROJECT }} --branch=pr-${{
            steps.pr.outputs.number }} --commit-hash=${{ steps.pr.outputs.sha }} --commit-dirty=true

      # Reads (changed files, file contents, the baseline run) use the workflow token. Writes use
      # the App token, so the check run and comment belong to the App. Without a status function
      # this step runs only when every earlier step succeeded.
      - name: Record the review
        if: steps.app-token.outcome == 'success' && steps.pr.outputs.outcome != 'none'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_URL: >-
            ${{ vars.VISUAL_REVIEW_APP_URL || format('https://{0}.pages.dev',
            vars.VISUAL_REVIEW_PAGES_PROJECT) }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          OUTCOME: ${{ steps.pr.outputs.outcome }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ATTEMPT: ${{ steps.pr.outputs.run-attempt }}
          RUN_ID: ${{ steps.pr.outputs.run-id }}
          SUMMARY_FILE: ${{ runner.temp }}/visual-review-deploy/site/summary.json
        run: node .github/scripts/visual-review.ts review

      # Any failure after the App token, including `resolve-pr` and the step above, and a
      # cancelled job, such as one past `timeout-minutes`, fails the check, so a stale approval or
      # report never stays in place. When `resolve-pr` failed, the run, commit, and pull request
      # come from the event, and `review` records the failure only on a commit the App already
      # checks or that is still an open pull request's head.
      - name: Record a failed publication
        if: (failure() || cancelled()) && steps.app-token.outcome == 'success'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_URL: >-
            ${{ vars.VISUAL_REVIEW_APP_URL || format('https://{0}.pages.dev',
            vars.VISUAL_REVIEW_PAGES_PROJECT) }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ steps.pr.outputs.sha || github.event.workflow_run.head_sha }}
          OUTCOME: publish-failed
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ATTEMPT: ${{ steps.pr.outputs.run-attempt || github.event.workflow_run.run_attempt }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ steps.pr.outputs.run-id || github.event.workflow_run.id }}
        run: node .github/scripts/visual-review.ts review
