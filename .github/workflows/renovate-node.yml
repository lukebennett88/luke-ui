name: Renovate Node configuration

on:
  pull_request:
    paths:
      - '.github/renovate.json5'
      - '.github/tests/renovate-node.mjs'
      - '.github/workflows/renovate-node.yml'
      - '.github/workflows/visual-regression.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  renovate-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Renovate
        run:
          npm install --prefix "$RUNNER_TEMP/renovate-test" --ignore-scripts --no-save
          renovate@44.188.2
      - name: Validate configuration and exercise Node updates
        env:
          RENOVATE_DIR: ${{ runner.temp }}/renovate-test/node_modules/renovate
        run: |
          node "$RENOVATE_DIR/dist/config-validator.js" --no-global .github/renovate.json5
          node .github/tests/renovate-node.mjs
